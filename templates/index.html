<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>CarPlay YouTube Premium</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        
        html, body {
            background-color: #0A0A0A;
            color: #FFFFFF;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            position: fixed;
        }

        /* THANH HEADER ĐỈNH MÀN HÌNH (Làm cao hơn để chứa cụm tìm kiếm phóng to gấp đôi) */
        .header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 20px;
            background-color: #121212;
            border-bottom: 1px solid #222;
            gap: 16px;
            height: 96px;
            flex-shrink: 0;
        }
        .header-bar h1 {
            color: #DB5304;
            font-size: 19px;
            font-weight: 800;
            white-space: nowrap;
            letter-spacing: 0.5px;
        }
        
        /* KHUNG TÌM KIẾM PHÓNG TO GẤP ĐÔI */
        .search-box {
            display: flex;
            gap: 16px;
            flex: 1;
            max-width: 760px;
            align-items: center;
        }
        .search-box input {
            background-color: #1E1E1E;
            border: 3px solid #333;
            color: #FFF;
            padding: 16px 24px;
            border-radius: 16px;
            outline: none;
            width: 100%;
            font-size: 20px; /* Chữ to gấp đôi */
            transition: all 0.2s;
        }
        .search-box input:focus {
            background-color: #262626;
            border-color: #DB5304;
        }
        .search-box button, .mic-btn {
            background-color: #DB5304;
            color: #FFF;
            border: none;
            padding: 0 28px;
            height: 60px; /* Nút tìm to gấp đôi */
            border-radius: 16px;
            font-weight: bold;
            cursor: pointer;
            font-size: 18px;
            white-space: nowrap;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.1s, background-color 0.2s;
        }
        .search-box button:active, .mic-btn:active {
            transform: scale(0.95);
            background-color: #B54202;
        }
        /* NÚT MIC TO GẤP ĐÔI NỔI BẬT */
        .mic-btn {
            background-color: #1F1F1F;
            border: 3px solid #DB5304;
            color: #DB5304;
            font-size: 32px;
            padding: 0 26px;
            min-width: 72px;
            height: 60px;
            border-radius: 16px;
        }
        .mic-btn.listening {
            background-color: #DB5304;
            color: #FFF;
            animation: pulse 1.2s infinite;
        }
        @keyframes pulse {
            0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(219, 83, 4, 0.7); }
            70% { transform: scale(1.05); box-shadow: 0 0 0 14px rgba(219, 83, 4, 0); }
            100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(219, 83, 4, 0); }
        }

        .logout-btn {
            background-color: #1A1A1A;
            color: #888;
            border: 1px solid #333;
            padding: 10px 14px;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            font-size: 13px;
            white-space: nowrap;
        }
        .logout-btn:active { color: #FFF; border-color: #666; }

        /* BỐ CỤC CHIA ĐÔI */
        .content-layout {
            display: flex;
            flex: 1;
            width: 100vw;
            height: calc(100vh - 96px);
            overflow: hidden;
        }

        @media (max-width: 768px) {
            .content-layout { flex-direction: column; }
            .video-container { width: 100% !important; height: 50% !important; border-right: none !important; border-bottom: 2px solid #222; padding: 6px !important; }
            .right-container { width: 100% !important; height: 50% !important; }
            .header-bar h1 { display: none; }
        }

        /* KHUNG TRÁI: VIDEO & MEDIA CONTROLS */
        .video-container {
            flex: 1;
            width: 50%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background-color: #050505;
            padding: 12px;
            border-right: 1px solid #222;
        }
        .video-wrapper {
            width: 100%;
            height: 100%;
            max-height: 68%;
            aspect-ratio: 16/9;
            background-color: #000;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid #2A2A2A;
            box-shadow: 0 6px 20px rgba(0,0,0,0.7);
            display: flex;
            justify-content: center;
            align-items: center;
        }
        video, iframe {
            width: 100%;
            height: 100%;
            outline: none;
            border: none;
        }
        
        .video-toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            margin-top: 8px;
            gap: 8px;
        }
        #current-title {
            font-size: 14px;
            color: #DB5304;
            font-weight: 700;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            flex: 1;
        }
        .action-buttons {
            display: flex;
            gap: 8px;
            flex-wrap: nowrap;
        }
        .ctrl-btn {
            background-color: #1C1C1E;
            color: #FFF;
            border: 1px solid #333;
            padding: 10px 16px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.15s;
            white-space: nowrap;
        }
        .ctrl-btn:active {
            transform: scale(0.95);
            background-color: #DB5304;
            border-color: #DB5304;
        }
        /* NÚT ❤️ THÍCH PHÓNG TO GẤP ĐÔI */
        .ctrl-btn-fav {
            background-color: #2E1100;
            border: 2px solid #DB5304;
            color: #DB5304;
            font-size: 15px;
            font-weight: 800;
            padding: 10px 20px;
        }
        .ctrl-btn-fs {
            background-color: #DB5304;
            color: #FFF;
            border: 2px solid #DB5304;
        }

        /* THANH ĐIỀU KHIỂN MEDIA PHÓNG TO GẤP ĐÔI */
        .media-control-bar {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            margin-top: 10px;
            gap: 16px;
            background: #141414;
            padding: 12px 18px;
            border-radius: 14px;
            border: 1px solid #222;
        }
        .media-btn {
            background-color: #222;
            color: #FFF;
            border: 2px solid #333;
            padding: 12px 28px; /* Tăng kích thước nút to gấp đôi */
            border-radius: 12px;
            font-size: 16px; /* Chữ to rõ */
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .media-btn:active { background-color: #DB5304; border-color: #DB5304; transform: scale(0.95); }
        .media-btn-main {
            background-color: #DB5304;
            border-color: #DB5304;
            font-size: 18px;
            padding: 12px 36px;
        }

        /* KHUNG PHẢI: MENU CHỦ ĐỀ & PLAYLIST */
        .right-container {
            flex: 1;
            width: 50%;
            height: 100%;
            background-color: #121212;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .category-wrapper {
            display: flex;
            align-items: center;
            background-color: #181818;
            border-bottom: 1px solid #222;
            padding: 10px 12px;
            gap: 10px;
            flex-shrink: 0;
        }
        .cat-nav-btn {
            background-color: #222;
            color: #DB5304;
            border: 1px solid #333;
            width: 44px;
            height: 46px;
            border-radius: 12px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
        .cat-nav-btn:active { background-color: #DB5304; color: #FFF; }

        .category-menu {
            display: flex;
            gap: 12px;
            padding: 6px;
            overflow-x: auto;
            scroll-behavior: smooth;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
            flex: 1;
            cursor: grab;
        }
        .category-menu::-webkit-scrollbar { display: none; }
        
        .cat-btn {
            background-color: #242424;
            color: #DDD;
            border: 1px solid #383838;
            padding: 12px 22px;
            border-radius: 26px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.2s;
            flex-shrink: 0;
        }
        .cat-btn:active, .cat-btn.active {
            background-color: #DB5304;
            color: #FFF;
            border-color: #DB5304;
            box-shadow: 0 3px 10px rgba(219, 83, 4, 0.4);
        }

        .playlist-header {
            padding: 10px 16px;
            font-size: 12px;
            font-weight: 700;
            color: #777;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            border-bottom: 1px solid #1F1F1F;
            flex-shrink: 0;
        }

        .playlist-items {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
            -webkit-overflow-scrolling: touch;
        }
        .song-item {
            display: flex;
            align-items: center;
            padding: 10px 12px;
            margin-bottom: 8px;
            background-color: #1A1A1A;
            border-radius: 12px;
            cursor: pointer;
            border: 1px solid #262626;
            transition: all 0.15s;
        }
        .song-item:active, .song-item.active {
            background-color: #262626;
            border-color: #DB5304;
            transform: scale(0.99);
        }
        .song-thumb {
            width: 100px;
            height: 56px;
            object-fit: cover;
            border-radius: 8px;
            margin-right: 12px;
            background-color: #000;
            flex-shrink: 0;
        }
        .song-info { flex: 1; overflow: hidden; }
        .song-title {
            font-size: 14px;
            font-weight: 600;
            color: #EEE;
            margin-bottom: 3px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            line-height: 1.3;
        }
        .song-artist { font-size: 12px; color: #888; }

        .license-modal {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background-color: rgba(0, 0, 0, 0.92);
            backdrop-filter: blur(8px);
            z-index: 99999;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        .license-box {
            background-color: #141414;
            border: 2px solid #DB5304;
            padding: 32px 28px;
            border-radius: 16px;
            width: 90%;
            max-width: 440px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(219, 83, 4, 0.3);
        }
        .license-box h2 { color: #DB5304; margin-bottom: 10px; font-size: 22px; font-weight: 800; }
        .license-box p { color: #AAA; margin-bottom: 18px; font-size: 14px; line-height: 1.4; }
        .license-box input {
            width: 100%;
            padding: 14px;
            font-size: 16px;
            border-radius: 10px;
            border: 1px solid #333;
            background-color: #222;
            color: #FFF;
            text-align: center;
            margin-bottom: 18px;
            outline: none;
        }
        .license-box input:focus { border-color: #DB5304; }
        .license-box button {
            width: 100%;
            padding: 14px;
            font-size: 15px;
            background-color: #DB5304;
            color: #FFF;
            border: none;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        .license-box button:active { background-color: #B54202; }
        #license-msg { margin-top: 14px; font-weight: 600; font-size: 13px; min-height: 20px; }
    </style>
</head>
<body>

    <div class="header-bar">
        <h1>🎵 CarPlay YouTube</h1>
        <div class="search-box">
            <input type="text" id="search-input" placeholder="Tìm bài hát, ca sĩ..." onkeypress="if(event.key === 'Enter') searchMusic()">
            <button class="mic-btn" id="mic-button" onclick="startVoiceSearch()" title="Tìm bằng giọng nói">🎤</button>
            <button onclick="searchMusic()">TÌM</button>
        </div>
        <button class="logout-btn" onclick="resetLicense()">ĐỔI KEY</button>
    </div>

    <div class="content-layout">
        <div class="video-container">
            <div class="video-wrapper" id="player-wrapper">
                <video id="player" controls playsinline></video>
            </div>
            
            <div class="video-toolbar">
                <div id="current-title">Vui lòng chọn bài hát từ danh sách</div>
                <div class="action-buttons">
                    <button class="ctrl-btn ctrl-btn-fav" onclick="saveCurrentFavorite()" title="Lưu yêu thích">❤️ Thích</button>
                    <button class="ctrl-btn" onclick="togglePiP()" title="Thu nhỏ nổi màn hình">🪟 PiP</button>
                    <button class="ctrl-btn ctrl-btn-fs" onclick="toggleFullScreen()" title="Phóng to video">⛶ Phóng to</button>
                </div>
            </div>

            <!-- THANH ĐIỀU KHIỂN MEDIA PHÓNG TO GẤP ĐÔI (TRƯỚC, DỪNG/PHÁT, SAU) -->
            <div class="media-control-bar">
                <button class="media-btn" onclick="playPrevSong()" title="Bài trước">⏮ Bài Trước</button>
                <button class="media-btn media-btn-main" id="play-pause-btn" onclick="togglePlayPause()" title="Dừng / Phát">⏸ Dừng</button>
                <button class="media-btn" onclick="playNextSong()" title="Bài sau">Bài Sau ⏭</button>
            </div>
        </div>

        <div class="right-container">
            <div class="category-wrapper">
                <button class="cat-nav-btn" onclick="scrollCategory(-1)">◀</button>
                <div class="category-menu" id="category-menu-bar">
                    {% for cat in categories %}
                    <button class="cat-btn {% if loop.first %}active{% endif %}" onclick="searchAndLoadPlaylist('{{ cat.searchKey }}', this)">
                        {{ cat.title }}
                    </button>
                    {% endfor %}
                </div>
                <button class="cat-nav-btn" onclick="scrollCategory(1)">▶</button>
            </div>
            
            <div class="playlist-header">📂 Danh Sách Kết Quả</div>
            
            <div class="playlist-items" id="playlist">
                <div style="padding:30px 20px; color:#666; text-align:center; font-size:13px;">Bấm vào một chủ đề ở trên hoặc tìm kiếm để chọn bài phát.</div>
            </div>
        </div>
    </div>

    <div id="license-overlay" class="license-modal" style="display: none;">
        <div class="license-box">
            <h2>🔑 KÍCH HOẠT BẢN QUYỀN</h2>
            <p>Nhập mã License Key được cấp để sử dụng ứng dụng trên xe:</p>
            <input type="text" id="license-key-input" placeholder="VD: CAR-TEST-8888-9999" autocomplete="off">
            <button onclick="submitLicenseKey()">XÁC THỰC KÍCH HOẠT</button>
            <div id="license-msg"></div>
        </div>
    </div>

    <script>
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycby_HLylDMlpHKUinLUiUWlaWlCuoIxOoqYIb0U46o9ZW0QXP4jzuEX4hcRbdU-NNqU/exec";

        let currentPlayingVideo = null;
        let currentPlaylistArray = [];
        let currentIndex = -1;

        const slider = document.getElementById('category-menu-bar');
        let isDown = false;
        let startX, scrollLeft;

        slider.addEventListener('mousedown', (e) => {
            isDown = true;
            slider.style.cursor = 'grabbing';
            startX = e.pageX - slider.offsetLeft;
            scrollLeft = slider.scrollLeft;
        });
        slider.addEventListener('mouseleave', () => { isDown = false; slider.style.cursor = 'grab'; });
        slider.addEventListener('mouseup', () => { isDown = false; slider.style.cursor = 'grab'; });
        slider.addEventListener('mousemove', (e) => {
            if(!isDown) return;
            e.preventDefault();
            const x = e.pageX - slider.offsetLeft;
            slider.scrollLeft = scrollLeft - (x - startX) * 2;
        });

        function scrollCategory(direction) {
            slider.scrollBy({ left: direction * 220, behavior: 'smooth' });
        }

        function toggleFullScreen() {
            const videoPlayer = document.querySelector('video') || document.querySelector('iframe');
            if (!videoPlayer) return;
            if (videoPlayer.tagName === 'VIDEO') {
                if (videoPlayer.webkitEnterFullscreen) {
                    videoPlayer.webkitEnterFullscreen();
                } else if (videoPlayer.requestFullscreen) {
                    videoPlayer.requestFullscreen();
                } else if (videoPlayer.webkitRequestFullscreen) {
                    videoPlayer.webkitRequestFullscreen();
                }
            } else if (videoPlayer.tagName === 'IFRAME') {
                if (videoPlayer.requestFullscreen) {
                    videoPlayer.requestFullscreen();
                } else if (videoPlayer.webkitRequestFullscreen) {
                    videoPlayer.webkitRequestFullscreen();
                }
            }
        }

        async function resolveAndPlay(videoId, title, element, thumbnail = '', uploaderName = '', index = -1) {
            currentPlayingVideo = {
                id: videoId,
                title: title,
                thumbnail: thumbnail || `https://i.ytimg.com/vi/${videoId}/hqdefault.jpg`,
                uploaderName: uploaderName || 'YouTube'
            };
            if (index !== -1) currentIndex = index;

            document.getElementById('current-title').innerText = "⚡ Đang tải nhanh: " + title;
            
            if (element) {
                document.querySelectorAll('.song-item').forEach(item => item.classList.remove('active'));
                element.classList.add('active');
            }

            try {
                const res = await fetch('/api/resolve', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ video_id: videoId })
                });
                const data = await res.json();
                const wrapper = document.getElementById('player-wrapper');

                if (data.success && data.stream_url) {
                    if (data.is_embed) {
                        wrapper.innerHTML = `<iframe src="${data.stream_url}" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>`;
                        document.getElementById('current-title').innerText = "▶ Đang phát (Embed): " + data.title;
                    } else {
                        wrapper.innerHTML = `<video id="player" controls autoplay playsinline src="${data.stream_url}"></video>`;
                        const newVideo = document.getElementById('player');
                        newVideo.load();
                        newVideo.play().catch(e => console.log("Auto-play blocked:", e));
                        document.getElementById('current-title').innerText = "▶ Đang phát trực tiếp: " + data.title;
                    }
                }
            } catch (err) {
                console.log("Lỗi kết nối máy chủ Flask!");
            }
        }

        function togglePlayPause() {
            const player = document.getElementById('player');
            const btn = document.getElementById('play-pause-btn');
            if (!player) return;
            if (player.paused) {
                player.play();
                btn.innerText = "⏸ Dừng";
            } else {
                player.pause();
                btn.innerText = "▶ Phát";
            }
        }

        function playNextSong() {
            if (currentPlaylistArray.length === 0) return;
            currentIndex = (currentIndex + 1) % currentPlaylistArray.length;
            const nextVideo = currentPlaylistArray[currentIndex];
            const items = document.querySelectorAll('.song-item');
            if (items[currentIndex]) {
                resolveAndPlay(nextVideo.id, nextVideo.title, items[currentIndex], nextVideo.thumbnail, nextVideo.uploaderName, currentIndex);
            }
        }

        function playPrevSong() {
            if (currentPlaylistArray.length === 0) return;
            currentIndex = (currentIndex - 1 + currentPlaylistArray.length) % currentPlaylistArray.length;
            const prevVideo = currentPlaylistArray[currentIndex];
            const items = document.querySelectorAll('.song-item');
            if (items[currentIndex]) {
                resolveAndPlay(prevVideo.id, prevVideo.title, items[currentIndex], prevVideo.thumbnail, prevVideo.uploaderName, currentIndex);
            }
        }

        // BỎ HOÀN TOÀN CÁC THÔNG BÁO ALERT KHI BẤM THÍCH
        function saveCurrentFavorite() {
            if (!currentPlayingVideo) return;
            let favorites = JSON.parse(localStorage.getItem('my_carplay_favorites') || '[]');
            if (!favorites.some(v => v.id === currentPlayingVideo.id)) {
                favorites.push(currentPlayingVideo);
                localStorage.setItem('my_carplay_favorites', JSON.stringify(favorites));
            }
        }

        async function togglePiP() {
            const videoPlayer = document.getElementById('player');
            if (!videoPlayer || videoPlayer.tagName !== 'VIDEO') return;
            try {
                if (videoPlayer.paused) await videoPlayer.play().catch(e => {});
                if (typeof videoPlayer.webkitSetPresentationMode === "function") {
                    videoPlayer.webkitSetPresentationMode(videoPlayer.webkitPresentationMode === 'picture-in-picture' ? 'inline' : 'picture-in-picture');
                } else if (document.pictureInPictureEnabled) {
                    if (document.pictureInPictureElement) await document.exitPictureInPicture();
                    else await videoPlayer.requestPictureInPicture();
                }
            } catch (err) {}
        }

        // KHI BẤM MIC: TỰ ĐỘNG DỪNG NHẠC NGAY LẬP TỨC ĐỂ THU ÂM GIỌNG NÓI
        function startVoiceSearch() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) return;

            // Dừng nhạc ngay lập tức khi bấm nút Mic
            const player = document.getElementById('player');
            if (player && !player.paused) {
                player.pause();
                document.getElementById('play-pause-btn').innerText = "▶ Phát";
            }

            const micBtn = document.getElementById('mic-button');
            const searchInput = document.getElementById('search-input');
            
            const recognition = new SpeechRecognition();
            recognition.lang = 'vi-VN';
            recognition.interimResults = false;
            recognition.maxAlternatives = 1;

            recognition.onstart = () => {
                micBtn.classList.add('listening');
                searchInput.placeholder = "Đang nghe giọng nói...";
            };

            recognition.onresult = (event) => {
                const speechText = event.results[0][0].transcript;
                searchInput.value = speechText;
                searchMusic();
            };

            recognition.onerror = () => {
                searchInput.placeholder = "Thử lại giọng nói...";
            };

            recognition.onend = () => {
                micBtn.classList.remove('listening');
                searchInput.placeholder = "Tìm bài hát, ca sĩ...";
            };

            recognition.start();
        }

        async function searchAndLoadPlaylist(query, element) {
            if (!query) return;

            if (element) {
                document.querySelectorAll('.cat-btn').forEach(btn => btn.classList.remove('active'));
                element.classList.add('active');
            }

            const playlistDiv = document.getElementById('playlist');

            if (query === "FAVORITES_CUSTOM") {
                let favorites = JSON.parse(localStorage.getItem('my_carplay_favorites') || '[]');
                currentPlaylistArray = favorites;
                
                if (favorites.length === 0) {
                    playlistDiv.innerHTML = '<div style="padding:40px 20px; color:#888; text-align:center; font-size:14px; line-height: 1.5;">Danh sách Yêu Thích đang trống.<br>Hãy nghe bài nào hay và bấm nút <b>❤️ Thích</b> để lưu vào đây nhé!</div>';
                    return;
                }

                playlistDiv.innerHTML = '';
                favorites.forEach((video, idx) => {
                    const item = document.createElement('div');
                    item.className = 'song-item';
                    item.onclick = () => resolveAndPlay(video.id, video.title, item, video.thumbnail, video.uploaderName, idx);
                    item.innerHTML = `
                        <img class="song-thumb" src="${video.thumbnail}" alt="thumb">
                        <div class="song-info">
                            <div class="song-title">${video.title}</div>
                            <div class="song-artist">${video.uploaderName}</div>
                        </div>
                    `;
                    playlistDiv.appendChild(item);
                });
                return;
            }

            playlistDiv.innerHTML = '<div style="padding:20px; color:#DB5304; text-align:center; font-size:13px;">Đang tải danh sách...</div>';

            try {
                const res = await fetch(`/api/search?q=${encodeURIComponent(query)}`);
                const data = await res.json();
                
                if (data.success && data.videos.length > 0) {
                    currentPlaylistArray = data.videos;
                    playlistDiv.innerHTML = '';
                    data.videos.forEach((video, idx) => {
                        const item = document.createElement('div');
                        item.className = 'song-item';
                        item.onclick = () => resolveAndPlay(video.id, video.title, item, video.thumbnail, video.uploaderName, idx);
                        item.innerHTML = `
                            <img class="song-thumb" src="${video.thumbnail}" alt="thumb">
                            <div class="song-info">
                                <div class="song-title">${video.title}</div>
                                <div class="song-artist">${video.uploaderName}</div>
                            </div>
                        `;
                        playlistDiv.appendChild(item);
                    });
                } else {
                    playlistDiv.innerHTML = '<div style="padding:20px; color:#FF5252; text-align:center; font-size:13px;">Không tìm thấy bài hát.</div>';
                }
            } catch (err) {
                playlistDiv.innerHTML = '<div style="padding:20px; color:#FF5252; text-align:center; font-size:13px;">Lỗi kết nối tìm kiếm.</div>';
            }
        }

        function searchMusic() {
            const query = document.getElementById('search-input').value.trim();
            if (query) {
                searchAndLoadPlaylist(query, null);
            }
        }

        function getDeviceId() {
            let deviceId = localStorage.getItem('app_device_id');
            if (!deviceId) {
                deviceId = 'CAR-' + Math.random().toString(36).substring(2, 10).toUpperCase() + '-' + Date.now();
                localStorage.setItem('app_device_id', deviceId);
            }
            return deviceId;
        }

        async function checkExistingLicense() {
            const savedKey = localStorage.getItem('app_license_key');
            const deviceId = getDeviceId();
            const overlay = document.getElementById('license-overlay');

            if (!savedKey) {
                overlay.style.display = 'flex';
                return;
            }

            try {
                const response = await fetch(WEB_APP_URL, {
                    method: "POST",
                    headers: { "Content-Type": "text/plain;charset=utf-8" },
                    body: JSON.stringify({ key: savedKey, device_id: deviceId })
                });
                const data = await response.json();
                
                if (data.success) {
                    overlay.style.display = 'none';
                    const firstCatBtn = document.querySelector('.cat-btn');
                    if (firstCatBtn) firstCatBtn.click();
                } else {
                    localStorage.removeItem('app_license_key');
                    overlay.style.display = 'flex';
                }
            } catch (err) {
                overlay.style.display = 'none';
            }
        }

        async function submitLicenseKey() {
            const key = document.getElementById('license-key-input').value.trim();
            const deviceId = getDeviceId();
            const msgDiv = document.getElementById('license-msg');

            if (!key) {
                msgDiv.style.color = '#FF5252';
                msgDiv.innerText = "Vui lòng nhập mã Key bản quyền!";
                return;
            }

            msgDiv.style.color = '#AAAAAA';
            msgDiv.innerText = "Đang kết nối xác thực...";

            try {
                const response = await fetch(WEB_APP_URL, {
                    method: "POST",
                    headers: { "Content-Type": "text/plain;charset=utf-8" },
                    body: JSON.stringify({ key: key, device_id: deviceId })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    localStorage.setItem('app_license_key', key);
                    msgDiv.style.color = '#4CAF50';
                    msgDiv.innerText = "Kích hoạt thành công!";
                    setTimeout(() => {
                        document.getElementById('license-overlay').style.display = 'none';
                        const firstCatBtn = document.querySelector('.cat-btn');
                        if (firstCatBtn) firstCatBtn.click();
                    }, 800);
                } else {
                    msgDiv.style.color = '#FF5252';
                    msgDiv.innerText = data.message;
                }
            } catch (err) {
                msgDiv.style.color = '#FF5252';
                msgDiv.innerText = "Lỗi kết nối mạng!";
            }
        }

        function resetLicense() {
            if (confirm("Bạn có muốn đổi mã Key bản quyền khác không?")) {
                localStorage.removeItem('app_license_key');
                location.reload();
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            checkExistingLicense();
        });
    </script>
</body>
</html>
